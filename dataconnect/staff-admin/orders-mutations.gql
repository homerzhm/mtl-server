    order(key: {id_expr: "response.orderItem_insert.id != '' ? vars.id : vars.id"}) @check(expr: "this != null && this.subtotalCents >= 0 && this.itemCount > 0 && this.discountCents >= 0 && this.discountCents <= this.subtotalCents && this.depositRequiredCents >= 0 && (this.finalTotalCents == null || this.finalTotalCents >= 0) && (this.cancellationTotalCents == null || this.cancellationTotalCents >= 0) && (this.contactPhoneNumber == null || this.contactPhoneNumber.matches(r'^\\+[1-9][0-9]{1,14}$'))", message: "ORDER_VALIDATION") { ...OrderFields }
    item: orderItem(key: {id_expr: "response.orderItem_insert.id"}) { ...OrderItemFields }
  }
  orderAuditEvent_insert(data: { orderId: $id, action: "ORDER_CREATED", actorUid_expr: "auth.uid", orderRevision_expr: "response.after.order.revision", changes_expr: """
{
  'before': null,
  'after': {
    'order': {
      'id': response.after.order.id,
      'orderNumber': response.after.order.orderNumber,
      'clientId': response.after.order.clientId,
      'contactPhoneNumber': response.after.order.contactPhoneNumber,
      'fulfillmentType': response.after.order.fulfillmentType,
      'status': response.after.order.status,
      'scheduledFor': response.after.order.scheduledFor == null ? dyn(null) : string(response.after.order.scheduledFor),
      'notes': response.after.order.notes,
      'subtotalCents': response.after.order.subtotalCents,
      'itemCount': response.after.order.itemCount,
      'discountCents': response.after.order.discountCents,
      'depositRequiredCents': response.after.order.depositRequiredCents,
      'finalTotalCents': response.after.order.finalTotalCents,
      'cancellationTotalCents': response.after.order.cancellationTotalCents,
      'revision': response.after.order.revision,
      'createdAt': string(response.after.order.createdAt),
      'updatedAt': string(response.after.order.updatedAt),
      'completedAt': response.after.order.completedAt == null ? dyn(null) : string(response.after.order.completedAt),
      'cancelledAt': response.after.order.cancelledAt == null ? dyn(null) : string(response.after.order.cancelledAt)
    },
    'item': {
      'id': response.after.item.id,
      'orderId': response.after.item.orderId,
      'productId': response.after.item.productId,

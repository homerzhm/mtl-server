mutation CreateOrder($id: UUID!, $itemId: UUID!, $productId: UUID!, $quantity: Int!, $unitPriceCents: Int = null, $clientId: UUID = null, $contactPhoneNumber: String = null, $scheduledFor: Timestamp = null, $notes: String = null, $itemNotes: String = null, $depositRequiredCents: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") @transaction {

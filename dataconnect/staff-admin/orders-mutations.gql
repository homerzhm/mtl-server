    client(key: {id_expr: "vars.clientId == null ? vars.id : vars.clientId"}) { id phoneNumber }
  }
  order_insert(data: {id: $id, clientId: $clientId,
    contactPhoneNumber_expr: "vars.contactPhoneNumber == null && vars.clientId != null ? response.source.client.phoneNumber : (vars.contactPhoneNumber == null ? vars.contactPhoneNumber : (vars.contactPhoneNumber.matches('^[0-9]{10}$') ? '+1' + vars.contactPhoneNumber : vars.contactPhoneNumber))",
    scheduledFor: $scheduledFor, notes: $notes, itemCount: 1, depositRequiredCents: $depositRequiredCents,
    subtotalCents_expr: "vars.quantity * (vars.unitPriceCents == null ? response.source.product.priceCents : vars.unitPriceCents)"})

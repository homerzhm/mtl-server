query ListStaffOrderSummaries($offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  staffOrderSummaries(limit: 100, offset: $offset, orderBy: [{createdAt: DESC}, {id: DESC}]) {id orderNumber status scheduledFor contactPhoneNumber clientId createdAt balanceCents netPaidCents isEstimate description groupQuantities}
}
query FindStaffOrderByNumber($number: String!, $offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  staffOrderSummaries(where: {orderNumber: {eq: $number}}, limit: 100, offset: $offset, orderBy: [{createdAt: DESC}, {id: DESC}]) {id orderNumber status scheduledFor contactPhoneNumber clientId createdAt balanceCents netPaidCents isEstimate description groupQuantities}
}
query FindStaffOrdersByPhone($phone: String!, $offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  staffOrderSummaries(where: {contactPhoneNumber: {eq: $phone}}, limit: 100, offset: $offset, orderBy: [{createdAt: DESC}, {id: DESC}]) {id orderNumber status scheduledFor contactPhoneNumber clientId createdAt balanceCents netPaidCents isEstimate description groupQuantities}
}
query GetBookingSettings @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  bookingSettings(id: "default") {id blockMinutes revision updatedAt updatedBy}
}
query ListCapacityGroups($offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  capacityGroups(limit: 100, offset: $offset, orderBy: [{id: ASC}]) {id code name capacityPerBlock archived revision createdAt updatedAt updatedBy}
}
query ListOrderCapacityAllocations($id: UUID!, $offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  orderCapacityAllocations(where: {orderId: {eq: $id}}, limit: 100, offset: $offset, orderBy: [{groupId: ASC}, {blockMinute: ASC}]) {id pickupDay groupId blockMinute quantity}
}
query ListOrderCapacitySummaries($id: UUID!, $offset: Int! = 0) @auth(expr: "auth.uid != '' && auth.token.firebase.sign_in_provider == 'google.com' && ((has(auth.token.staff) && auth.token.staff == true) || (has(auth.token.admin) && auth.token.admin == true))") {
  orderCapacitySummaries(where: {orderId: {eq: $id}}, limit: 100, offset: $offset, orderBy: [{groupId: ASC}]) {orderId groupId groupName quantity}
}

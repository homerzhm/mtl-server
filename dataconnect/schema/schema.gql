type Product @table(name: "product", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  description: String
  chineseName: String
  revision: Int! @default(value: 0)
  # Fixed selling price in Canadian cents.
  priceCents: Int!
  isActive: Boolean! @default(value: true)
  capacityGroup: CapacityGroup
  capacityGroupId: UUID @index
  createdAt: Timestamp! @default(expr: "request.time")
}

# Contact phone numbers use canonical international format (+country code and digits).
type Client @table(name: "client", key: ["id"]) {
  id: UUID! @default(expr: "uuidV4()")
  phoneNumber: String! @unique
  name: String
  email: String
  revision: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}
